name: Lint PR
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  check-title:
    name: Проверка заголовка
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
